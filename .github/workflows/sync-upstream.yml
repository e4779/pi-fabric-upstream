name: Sync upstream

# Keeps the fork current with upstream: merges upstream/main into the
# fork's main on a daily schedule and pushes. The push then triggers
# the existing "Publish fork" workflow, which republishes
# @e4779/pi-fabric at the new upstream base version (-fork.<run_number>).
# If the merge conflicts, this job fails red and needs a human.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  # NOT `workflows: write`: that scope does not exist in workflow-file
  # `permissions` (github/docs reusables/actions/github-token-available-permissions),
  # and its presence made GitHub reject the whole file — every push got a
  # zero-job "workflow file issue" failure (fcf4fe2..acade6d era). Merges that
  # touch .github/workflows/ cannot be pushed by GITHUB_TOKEN at all; the
  # merge step fails loudly for a human instead.
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main (skip when already current)
        run: |
          git remote add upstream https://github.com/monotykamary/pi-fabric.git
          git fetch upstream main
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "upstream commits not in fork main: $BEHIND"
          if [ "$BEHIND" = "0" ]; then
            echo "Fork main is already current with upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          if git diff --name-only ORIG_HEAD HEAD -- .github/workflows/ | grep -q .; then
            echo "Merge touches .github/workflows/ — GITHUB_TOKEN cannot push workflow files."
            echo "Sync manually: merge upstream/main on main and push from a machine with credentials."
            exit 1
          fi
          git push origin main
